name: CI - Build & Bundle Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Build production bundle
        working-directory: ./client
        run: npm run build

      - name: Check bundle size
        working-directory: ./client
        run: |
          echo "=== Bundle Size Report ==="
          du -sh dist/assets/*.js dist/assets/*.css 2>/dev/null || true
          echo ""
          
          # Check for oversized chunks
          MAX_SIZE_KB=350
          FAILED=0
          
          for file in dist/assets/*.js; do
            if [ -f "$file" ]; then
              SIZE_KB=$(du -k "$file" | cut -f1)
              FILENAME=$(basename "$file")
              echo "$FILENAME: ${SIZE_KB}KB"
              
              if [ "$SIZE_KB" -gt "$MAX_SIZE_KB" ]; then
                echo "❌ ERROR: $FILENAME (${SIZE_KB}KB) exceeds ${MAX_SIZE_KB}KB limit"
                FAILED=1
              fi
            fi
          done
          
          echo ""
          TOTAL_JS=$(du -sk dist/assets/*.js 2>/dev/null | awk '{sum+=$1} END {print sum}')
          TOTAL_CSS=$(du -sk dist/assets/*.css 2>/dev/null | awk '{sum+=$1} END {print sum}')
          echo "Total JS: ${TOTAL_JS}KB"
          echo "Total CSS: ${TOTAL_CSS}KB"
          echo ""
          
          if [ "$FAILED" -eq 1 ]; then
            echo "❌ Bundle size check failed. Consider adding code splitting with React.lazy()."
            exit 1
          else
            echo "✅ Bundle size check passed."
          fi

      - name: Check for missing lazy imports
        working-directory: ./client
        run: |
          echo "=== Checking for eager page imports ==="
          
          # Look for non-lazy imports of page components in App.jsx
          EAGER_IMPORTS=$(grep -n "import.*from './pages/" src/App.jsx 2>/dev/null || true)
          
          if [ -n "$EAGER_IMPORTS" ]; then
            echo "⚠️  WARNING: Found eager page imports in App.jsx:"
            echo "$EAGER_IMPORTS"
            echo "Consider using React.lazy() for route-level code splitting."
          else
            echo "✅ No eager page imports found — code splitting looks good."
          fi

      - name: Check for performance anti-patterns
        working-directory: ./client
        run: |
          echo "=== Performance Anti-Pattern Check ==="
          
          # Check for blocking API calls in auth initialization
          BLOCKING_AUTH=$(grep -n "await getMe()" src/context/AuthContext.jsx 2>/dev/null | grep -v "// Verify token quietly" || true)
          if [ -n "$BLOCKING_AUTH" ]; then
            echo "⚠️  WARNING: Potential blocking auth call found:"
            echo "$BLOCKING_AUTH"
          else
            echo "✅ Auth initialization looks non-blocking."
          fi
          
          # Check for large unoptimized images in public folder
          if [ -d "public" ]; then
            LARGE_IMAGES=$(find public -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) -size +500k 2>/dev/null)
            if [ -n "$LARGE_IMAGES" ]; then
              echo "⚠️  WARNING: Large images found in public/:"
              echo "$LARGE_IMAGES"
            else
              echo "✅ No oversized images in public/."
            fi
          fi

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: client/dist/
          retention-days: 7
